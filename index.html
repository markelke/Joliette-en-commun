<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Votre conteneur de babillard -->
    <div class="jc-home-footer">
        <a class="jc-bab-publier" href="#">Publier une annonce →</a>
        <a class="jc-bab-voir-tout" href="#">Voir toutes les annonces →</a>
    </div>
    <!-- Grille d'événements de test -->
<div class="jc-events-grid-layout">
  <ul class="jc-timeline">
    
    <!-- Première tuile d'événement -->
    <li class="jc-timeline-item">
      <span class="jc-timeline-time">5 JUIN 2026</span>
      <h3 class="jc-timeline-title">Réunion de quartier</h3>
      <img class="jc-timeline-img" src="https://via.placeholder.com/300x160" alt="Image événement">
      <p class="jc-timeline-desc">Discussion sur les projets de verdissement de notre district.</p>
      <div class="jc-card-footer">
        <span class="jc-toggle-label"></span> <!-- Le texte "Voir plus" est injecté par CSS -->
      </div>
    </li>

    <!-- Deuxième tuile d'événement -->
    <li class="jc-timeline-item">
      <span class="jc-timeline-time">12 JUIN 2026</span>
      <h3 class="jc-timeline-title">Nettoyage du Parc Lajoie</h3>
      <img class="jc-timeline-img" src="https://via.placeholder.com/300x160" alt="Image événement">
      <p class="jc-timeline-desc">Corvée citoyenne pour préparer le parc pour l'été.</p>
      <div class="jc-card-footer">
        <span class="jc-toggle-label"></span>
      </div>
    </li>

  </ul>
</div>

</body>
</html>
